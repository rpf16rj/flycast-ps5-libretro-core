name: build-and-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLYCAST_REPO: https://github.com/sysfce2/libretro-flycast
  FLYCAST_REV: e36e9df
  SDK_RELEASE_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: LLVM at a space-free path
        shell: bash
        run: |
          # The prospero clang driver derives paths from argv[0]; spaces in
          # "Program Files" break it, so junction to C:\ps5llvm.
          LLVM_SRC="C:\\Program Files\\LLVM"
          [ -f "$LLVM_SRC/bin/clang.exe" ] || LLVM_SRC="$(dirname "$(dirname "$(which clang)")")"
          echo "LLVM source: $LLVM_SRC"
          MSYS=winsymlinks:nativestrict ln -s "$(cygpath -u "$LLVM_SRC")" /c/ps5llvm 2>/dev/null || \
            cmd //c mklink //J C:\\ps5llvm "$LLVM_SRC"
          C:/ps5llvm/bin/clang.exe --version | head -1
          test -f C:/ps5llvm/bin/ld.lld.exe

      - name: Fetch ps5-payload-sdk
        shell: bash
        run: |
          curl -L -o sdk.zip "$SDK_RELEASE_URL"
          unzip -q sdk.zip
          rm sdk.zip
          test -f ps5-payload-sdk/target/lib/libc++.a
          test -f ps5-payload-sdk/win/ninja.exe

      - name: Fetch flycast (pinned revision + submodules)
        shell: bash
        run: |
          git clone "$FLYCAST_REPO" flycast
          git -C flycast checkout "$FLYCAST_REV"
          git -C flycast submodule update --init --recursive
          test -f flycast/core/deps/tinygettext/external/tinycmmc/CMakeLists.txt

      - name: Build flycast_libretro.so
        shell: bash
        env:
          PS5_LLVM: C:/ps5llvm
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/ps5-payload-sdk
          FLYCAST_SRC: ${{ github.workspace }}/flycast
        run: ./build.sh

      - name: Stage deployable tree
        shell: bash
        run: |
          mkdir -p dist/cores dist/info
          cp build/flycast-ps5/flycast_libretro.so dist/cores/
          cp info/flycast_libretro.info dist/info/
          cp info/flycast_libretro.info dist/cores/
          cp build/flycast-ps5/abi.json dist/ 2>/dev/null || true
          ls -lR dist

      - id: date
        shell: bash
        run: echo "d=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: bash
        run: |
          # bsdtar (in Windows system32) writes zip when the archive ends in .zip
          tar -a -cf "flycast-ps5-${{ steps.date.outputs.d }}.zip" -C dist .
          tar -tf "flycast-ps5-${{ steps.date.outputs.d }}.zip" | head -20

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.date.outputs.d }}-run${{ github.run_number }}"
          cat > release-notes.md <<'EOF'
          PS5-native `flycast_libretro.so` — ready to use in **RetroArch for PS5**.

          This core was built for the **PS5_RetroArch** project
          (`mihawk-99/PS5_RetroArch`, formerly `chw602608/PS5_RetroArch`),
          the native PlayStation 5 RetroArch that runs as the **PPSA99169** title.
          Credits to the PS5 RetroArch author and to the Flycast project
          (`sysfce2/libretro-flycast`, revision `e36e9df`).

          ## Install

          Extract the ZIP into the RetroArch PS5 directory
          (`/app0`, e.g. `/usb0/homebrew/PPSA99169/` or `/data/homebrew/PPSA99169/`):

          - `cores/flycast_libretro.so` -> `<app0>/cores/`
          - `info/flycast_libretro.info` -> `<app0>/info/`
          - (the extra copy `cores/flycast_libretro.info` is already in the package)

          If the extensions do not show in Core Information or your games
          (.cdi/.gdi/.chd) do not appear in the browser, delete
          `info/core_info.cache` (or create an empty `info/core_info.refresh` file)
          and restart RetroArch — the cache keeps stale entries without .info.

          ## Contents

          - `flycast_libretro.so` — PS5 ELF64, 25 retro_* exports, only
            loader-supported relocations, no PT_TLS, no W+X, all imports covered
            by the eboot's binding table
          - `flycast_libretro.info` — metadata (Dreamcast/Naomi/Atomiswave)
          - `abi.json` — check_core.py report

          Commit: COMMIT_SHA
          EOF
          sed -i "s/COMMIT_SHA/${{ github.sha }}/" release-notes.md
          gh release create "$TAG" \
            --title "flycast_libretro ${TAG}" \
            --notes-file release-notes.md \
            "flycast-ps5-${{ steps.date.outputs.d }}.zip"
